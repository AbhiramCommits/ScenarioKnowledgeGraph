name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest pytest-cov ruff black mypy
      - name: Lint with ruff
        run: ruff check skg tests
      - name: Format check with black
        run: black --check skg tests
      - name: Type check with mypy
        run: mypy skg --ignore-missing-imports || true
      - name: Run tests
        run: pytest tests/ -v --cov=skg --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
      - name: Run smoke test
        run: |
          python -m skg.logs.generator --n 200 --out /tmp/smoke --seed 42
          python -m skg.extract.spark_job --in /tmp/smoke --out /tmp/smoke_graph
